<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NexusChat — Real-time Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <script src="/socket.io/socket.io.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d0f14;
      --surface:  #13161e;
      --panel:    #191d28;
      --border:   #252a38;
      --accent:   #7c6aff;
      --accent2:  #ff6b9d;
      --green:    #3ddc97;
      --text:     #e8eaf0;
      --muted:    #5a6080;
      --bubble-me: #241f4a;
      --bubble-them: #181c26;
      --radius:   14px;
      --font-ui: 'Syne', sans-serif;
      --font-mono: 'DM Mono', monospace;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-ui); overflow: hidden; }

    /* ── LOGIN OVERLAY ── */
    #login-overlay {
      position: fixed; inset: 0; background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      z-index: 100; transition: opacity .4s ease;
    }
    #login-overlay.hidden { opacity: 0; pointer-events: none; }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px 40px;
      width: 380px;
      text-align: center;
      box-shadow: 0 0 80px rgba(124,106,255,.15);
      animation: cardIn .5s cubic-bezier(.22,1,.36,1);
    }
    @keyframes cardIn { from { opacity:0; transform: translateY(24px) scale(.97); } to { opacity:1; transform: none; } }

    .login-logo {
      font-size: 2.2rem; font-weight: 800; letter-spacing: -1px; margin-bottom: 6px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .login-sub { color: var(--muted); font-size: .85rem; margin-bottom: 36px; font-family: var(--font-mono); }

    .login-card label { display: block; text-align: left; font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
    .login-card input, .login-card select {
      width: 100%; background: var(--panel); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 14px; color: var(--text);
      font-family: var(--font-ui); font-size: .95rem; margin-bottom: 18px;
      outline: none; transition: border-color .2s;
    }
    .login-card input:focus, .login-card select:focus { border-color: var(--accent); }
    .login-card select option { background: var(--panel); }

    .btn-join {
      width: 100%; padding: 14px; border: none; border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff; font-family: var(--font-ui); font-size: 1rem; font-weight: 700;
      cursor: pointer; transition: opacity .2s, transform .15s;
      letter-spacing: .5px;
    }
    .btn-join:hover { opacity: .9; transform: translateY(-1px); }
    .btn-join:active { transform: scale(.98); }

    /* ── APP LAYOUT ── */
    #app { display: flex; height: 100vh; }

    /* ── SIDEBAR ── */
    .sidebar {
      width: 240px; min-width: 240px; background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden;
    }

    .sidebar-brand {
      padding: 20px 18px 14px;
      font-size: 1.1rem; font-weight: 800; letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-section { padding: 14px 18px 6px; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; }

    .room-list { padding: 0 8px; flex-shrink: 0; }
    .room-item {
      padding: 9px 12px; border-radius: 8px; cursor: pointer;
      font-size: .9rem; color: var(--muted); transition: all .15s;
      display: flex; align-items: center; gap: 8px; margin-bottom: 2px;
    }
    .room-item:hover { background: var(--panel); color: var(--text); }
    .room-item.active { background: rgba(124,106,255,.18); color: var(--accent); font-weight: 600; }
    .room-item .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
    .room-item.active .dot { background: var(--accent); }

    .divider { height: 1px; background: var(--border); margin: 12px 0; }

    .user-list { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
    .user-list::-webkit-scrollbar { width: 3px; }
    .user-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .user-chip {
      display: flex; align-items: center; gap: 9px;
      padding: 7px 10px; border-radius: 8px; margin-bottom: 2px;
    }
    .user-avatar {
      width: 26px; height: 26px; border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      font-size: .7rem; font-weight: 700; color: #fff; flex-shrink: 0;
      text-transform: uppercase;
    }
    .user-chip span { font-size: .85rem; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .you-badge { font-size: .65rem; background: rgba(124,106,255,.25); color: var(--accent); border-radius: 4px; padding: 1px 5px; margin-left: auto; flex-shrink: 0; }

    .sidebar-me {
      border-top: 1px solid var(--border); padding: 12px 14px;
      display: flex; align-items: center; gap: 10px;
    }
    .me-avatar { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; flex-shrink: 0; font-size: .9rem; }
    .me-info { overflow: hidden; }
    .me-name { font-weight: 600; font-size: .9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .me-status { font-size: .72rem; color: var(--green); display: flex; align-items: center; gap: 4px; font-family: var(--font-mono); }
    .me-status::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--green); display: inline-block; }

    /* ── MAIN CHAT ── */
    .chat-main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    .chat-header {
      padding: 16px 24px; background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px;
    }
    .chat-header-room { font-size: 1rem; font-weight: 700; }
    .chat-header-count { font-size: .8rem; color: var(--muted); font-family: var(--font-mono); margin-left: auto; }
    .online-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex-shrink: 0; box-shadow: 0 0 6px var(--green); }

    /* ── MESSAGES ── */
    .messages-wrap { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 2px; }
    .messages-wrap::-webkit-scrollbar { width: 4px; }
    .messages-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .msg-group { margin-bottom: 10px; }

    .system-msg {
      text-align: center; font-size: .76rem; color: var(--muted);
      font-family: var(--font-mono); padding: 6px 0;
    }

    .msg-row { display: flex; gap: 10px; align-items: flex-end; margin-bottom: 2px; }
    .msg-row.me { flex-direction: row-reverse; }

    .msg-avatar {
      width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: .75rem; font-weight: 700; color: #fff; align-self: flex-end;
    }
    .msg-avatar.hidden { visibility: hidden; }

    .msg-content { max-width: 65%; }
    .msg-row.me .msg-content { align-items: flex-end; display: flex; flex-direction: column; }

    .msg-name { font-size: .72rem; color: var(--muted); margin-bottom: 3px; padding-left: 2px; font-family: var(--font-mono); }
    .msg-row.me .msg-name { text-align: right; padding-right: 2px; }

    .msg-bubble {
      background: var(--bubble-them); border: 1px solid var(--border);
      border-radius: 14px 14px 14px 4px;
      padding: 10px 14px; font-size: .9rem; line-height: 1.5;
      word-break: break-word; position: relative;
      animation: bubbleIn .25s cubic-bezier(.22,1,.36,1);
    }
    @keyframes bubbleIn { from { opacity:0; transform: scale(.95) translateY(4px); } to { opacity:1; transform: none; } }

    .msg-row.me .msg-bubble {
      background: var(--bubble-me); border-color: rgba(124,106,255,.3);
      border-radius: 14px 14px 4px 14px; color: #ddd8ff;
    }

    .msg-time { font-size: .65rem; color: var(--muted); margin-top: 3px; font-family: var(--font-mono); padding-left: 2px; }
    .msg-row.me .msg-time { text-align: right; padding-right: 2px; }

    /* ── TYPING INDICATOR ── */
    #typing-bar { min-height: 22px; padding: 0 24px 4px; font-size: .76rem; color: var(--muted); font-family: var(--font-mono); display: flex; align-items: center; gap: 6px; }
    .typing-dots span { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--muted); animation: bounce .9s infinite; margin: 0 1px; }
    .typing-dots span:nth-child(2) { animation-delay: .2s; }
    .typing-dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-5px); } }

    /* ── INPUT BAR ── */
    .input-bar {
      padding: 14px 20px 18px;
      background: var(--surface); border-top: 1px solid var(--border);
      display: flex; gap: 10px; align-items: flex-end;
    }
    #msg-input {
      flex: 1; background: var(--panel); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 16px; color: var(--text);
      font-family: var(--font-ui); font-size: .92rem; outline: none;
      resize: none; max-height: 120px; line-height: 1.4;
      transition: border-color .2s;
    }
    #msg-input:focus { border-color: var(--accent); }
    #msg-input::placeholder { color: var(--muted); }

    #send-btn {
      width: 44px; height: 44px; border-radius: 12px; border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: opacity .2s, transform .15s;
    }
    #send-btn:hover { opacity: .85; transform: scale(1.05); }
    #send-btn:active { transform: scale(.95); }
    #send-btn svg { width: 18px; height: 18px; }

    /* ── CONNECTION STATUS ── */
    #conn-status {
      position: fixed; top: 14px; right: 14px; z-index: 200;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 6px 14px;
      font-size: .75rem; font-family: var(--font-mono);
      display: flex; align-items: center; gap: 6px;
      transition: all .3s;
    }
    #conn-status .indicator { width: 8px; height: 8px; border-radius: 50%; }
    #conn-status.connected .indicator { background: var(--green); box-shadow: 0 0 6px var(--green); }
    #conn-status.disconnected .indicator { background: #ff5a5f; }
    #conn-status.connecting .indicator { background: #f9a825; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
  </style>
</head>
<body>

<!-- Connection status badge -->
<div id="conn-status" class="connecting">
  <div class="indicator"></div>
  <span id="conn-text">Connecting…</span>
</div>

<!-- Login Overlay -->
<div id="login-overlay">
  <div class="login-card">
    <div class="login-logo">NexusChat</div>
    <div class="login-sub">real-time · socket.io · full-stack</div>
    <label>Your Name</label>
    <input id="username-input" type="text" placeholder="e.g. Alex" maxlength="20" autocomplete="off" />
    <label>Join a Room</label>
    <select id="room-select">
      <option value="general"># general</option>
      <option value="random"># random</option>
      <option value="tech"># tech</option>
    </select>
    <button class="btn-join" id="join-btn">Enter Chat →</button>
  </div>
</div>

<!-- App -->
<div id="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-brand">NexusChat</div>

    <div class="sidebar-section">Channels</div>
    <div class="room-list" id="room-list">
      <div class="room-item active" data-room="general"><span class="dot"></span># general</div>
      <div class="room-item" data-room="random"><span class="dot"></span># random</div>
      <div class="room-item" data-room="tech"><span class="dot"></span># tech</div>
    </div>

    <div class="divider"></div>

    <div class="sidebar-section">Online — <span id="online-count">0</span></div>
    <div class="user-list" id="user-list"></div>

    <div class="sidebar-me" id="sidebar-me" style="display:none">
      <div class="me-avatar" id="me-avatar"></div>
      <div class="me-info">
        <div class="me-name" id="me-name"></div>
        <div class="me-status">online</div>
      </div>
    </div>
  </aside>

  <!-- Chat Main -->
  <main class="chat-main">
    <div class="chat-header">
      <div class="online-dot"></div>
      <div class="chat-header-room" id="chat-header-room"># general</div>
      <div class="chat-header-count" id="chat-header-count">0 online</div>
    </div>

    <div class="messages-wrap" id="messages"></div>

    <div id="typing-bar"></div>

    <div class="input-bar">
      <textarea id="msg-input" rows="1" placeholder="Send a message…"></textarea>
      <button id="send-btn" title="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </main>
</div>

<script>
  // ── SOCKET.IO CLIENT ──
  const socket = io();

  let myUsername = '';
  let myRoom = 'general';
  let myColor = '#7c6aff';
  let typingTimer = null;
  let isTyping = false;
  const typingUsers = {};

  // ── CONNECTION STATUS ──
  const connStatus = document.getElementById('conn-status');
  const connText = document.getElementById('conn-text');

  socket.on('connect', () => {
    connStatus.className = 'connected';
    connText.textContent = 'Connected';
  });
  socket.on('disconnect', () => {
    connStatus.className = 'disconnected';
    connText.textContent = 'Disconnected';
  });
  socket.on('connect_error', () => {
    connStatus.className = 'disconnected';
    connText.textContent = 'Error';
  });

  // ── LOGIN ──
  const overlay = document.getElementById('login-overlay');
  const usernameInput = document.getElementById('username-input');
  const roomSelect = document.getElementById('room-select');
  const joinBtn = document.getElementById('join-btn');

  usernameInput.focus();
  usernameInput.addEventListener('keydown', e => { if (e.key === 'Enter') joinBtn.click(); });

  joinBtn.addEventListener('click', () => {
    const name = usernameInput.value.trim();
    if (!name) { usernameInput.focus(); return; }
    myUsername = name;
    myRoom = roomSelect.value;
    socket.emit('join', { username: myUsername, room: myRoom });
    overlay.classList.add('hidden');
    setupMe();
    updateActiveRoom(myRoom);
  });

  function setupMe() {
    document.getElementById('sidebar-me').style.display = 'flex';
    document.getElementById('me-name').textContent = myUsername;
    const av = document.getElementById('me-avatar');
    av.textContent = myUsername[0].toUpperCase();
    av.style.background = myColor;
  }

  // ── MESSAGES ──
  const messagesWrap = document.getElementById('messages');
  let lastSender = null;

  function appendMessage(msg, isMe) {
    const row = document.createElement('div');
    row.className = 'msg-row' + (isMe ? ' me' : '');

    const showAvatar = lastSender !== msg.username;
    lastSender = msg.username;

    const avEl = document.createElement('div');
    avEl.className = 'msg-avatar' + (showAvatar ? '' : ' hidden');
    avEl.textContent = msg.username[0].toUpperCase();
    avEl.style.background = msg.avatar || '#7c6aff';

    const content = document.createElement('div');
    content.className = 'msg-content';

    if (showAvatar && !isMe) {
      const nameEl = document.createElement('div');
      nameEl.className = 'msg-name';
      nameEl.textContent = msg.username;
      content.appendChild(nameEl);
    }

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.textContent = msg.text;

    const timeEl = document.createElement('div');
    timeEl.className = 'msg-time';
    timeEl.textContent = formatTime(msg.timestamp);

    content.appendChild(bubble);
    content.appendChild(timeEl);

    if (isMe) {
      row.appendChild(content);
      row.appendChild(avEl);
    } else {
      row.appendChild(avEl);
      row.appendChild(content);
    }

    messagesWrap.appendChild(row);
    scrollToBottom();
  }

  function appendSystem(text) {
    lastSender = null;
    const el = document.createElement('div');
    el.className = 'system-msg';
    el.textContent = `— ${text} —`;
    messagesWrap.appendChild(el);
    scrollToBottom();
  }

  function scrollToBottom() {
    messagesWrap.scrollTop = messagesWrap.scrollHeight;
  }

  function formatTime(ts) {
    return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  // ── SOCKET EVENTS ──
  socket.on('chat_message', (msg) => {
    appendMessage(msg, msg.username === myUsername);
    if (msg.username === myUsername) myColor = msg.avatar;
  });

  socket.on('system_message', ({ text }) => appendSystem(text));

  socket.on('room_history', ({ messages }) => {
    messagesWrap.innerHTML = '';
    lastSender = null;
    messages.forEach(m => appendMessage(m, m.username === myUsername));
  });

  socket.on('room_users', (users) => {
    const list = document.getElementById('user-list');
    const count = document.getElementById('online-count');
    const headerCount = document.getElementById('chat-header-count');
    count.textContent = users.length;
    headerCount.textContent = `${users.length} online`;
    list.innerHTML = '';
    users.forEach(u => {
      const chip = document.createElement('div');
      chip.className = 'user-chip';
      chip.innerHTML = `
        <div class="user-avatar" style="background:${u.avatar}">${u.username[0].toUpperCase()}</div>
        <span>${u.username}</span>
        ${u.username === myUsername ? '<span class="you-badge">you</span>' : ''}
      `;
      list.appendChild(chip);
    });
  });

  // ── TYPING ──
  const typingBar = document.getElementById('typing-bar');

  socket.on('typing', ({ username, isTyping: typing }) => {
    if (typing) {
      typingUsers[username] = true;
    } else {
      delete typingUsers[username];
    }
    renderTyping();
  });

  function renderTyping() {
    const names = Object.keys(typingUsers);
    if (!names.length) { typingBar.innerHTML = ''; return; }
    const who = names.length === 1 ? names[0] : names.length === 2
      ? `${names[0]} & ${names[1]}` : `${names[0]} & ${names.length - 1} others`;
    typingBar.innerHTML = `
      <div class="typing-dots"><span></span><span></span><span></span></div>
      <span>${who} ${names.length === 1 ? 'is' : 'are'} typing…</span>
    `;
  }

  // ── SEND MESSAGE ──
  const msgInput = document.getElementById('msg-input');
  const sendBtn = document.getElementById('send-btn');

  function sendMessage() {
    const text = msgInput.value.trim();
    if (!text || !myUsername) return;
    socket.emit('chat_message', { text, room: myRoom });
    msgInput.value = '';
    msgInput.style.height = 'auto';
    clearTyping();
  }

  sendBtn.addEventListener('click', sendMessage);
  msgInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // Auto-resize textarea
  msgInput.addEventListener('input', () => {
    msgInput.style.height = 'auto';
    msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
    handleTyping();
  });

  function handleTyping() {
    if (!isTyping) {
      isTyping = true;
      socket.emit('typing', { room: myRoom, isTyping: true });
    }
    clearTimeout(typingTimer);
    typingTimer = setTimeout(clearTyping, 1500);
  }

  function clearTyping() {
    if (isTyping) {
      isTyping = false;
      socket.emit('typing', { room: myRoom, isTyping: false });
    }
    clearTimeout(typingTimer);
  }

  // ── ROOM SWITCHING ──
  document.getElementById('room-list').addEventListener('click', e => {
    const item = e.target.closest('.room-item');
    if (!item || !myUsername) return;
    const room = item.dataset.room;
    if (room === myRoom) return;
    myRoom = room;
    socket.emit('switch_room', { room });
    updateActiveRoom(room);
    clearTyping();
    lastSender = null;
  });

  function updateActiveRoom(room) {
    document.querySelectorAll('.room-item').forEach(el => {
      el.classList.toggle('active', el.dataset.room === room);
    });
    document.getElementById('chat-header-room').textContent = `# ${room}`;
  }
</script>
</body>
</html>
